# Read the Docs build configuration.
# https://docs.readthedocs.io/en/stable/config-file/v2.html
version: 2

build:
  os: ubuntu-24.04
  tools:
    python: "3.12"
  apt_packages:
    - doxygen
  jobs:
    # Generate the C API XML before Sphinx runs (conf.py also does this for
    # local builds, but doing it explicitly here keeps the RTD build clear).
    pre_build:
      - cd docs && doxygen Doxyfile

sphinx:
  configuration: docs/conf.py
  fail_on_warning: false

python:
  install:
    - requirements: docs/requirements.txt
