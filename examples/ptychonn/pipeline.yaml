pipeline:
  name: ptychonn_two_stage

transport:
  type: nats
  nats_url: nats://127.0.0.1:4222

publisher:
  synthetic: true
  num_frames: 10000
  rate_hz: 1000

benchmark:
  app_timeout_s: 45

stages:
  - name: stage1
    runtime:
      threads: 4
      callback_batch: 256
    ingress:
      stream: FRAMES
      subject: frames.raw
      durable: drava_stage1
      fetch_batch: 256
      fetch_timeout_ms: 200
    egress:
      stream: PREDICTIONS
      subject: frames.stage1
      # For socket transport, use:
      # output_fifo_path: /tmp/drava_stage1_out

  - name: stage2
    runtime:
      threads: 4
      callback_batch: 256
    ingress:
      stream: PREDICTIONS
      subject: frames.stage1
      durable: drava_stage2
      fetch_batch: 256
      fetch_timeout_ms: 500
      # For socket transport, use:
      # socket_path: /tmp/drava_stage2_in
